  // Forward the whole path, not just the home page: /out-dc/s/14th-and-u/
  // has to land on that spot's share page, and /out-dc/#/tonight has to keep
  // its hash route. Anything we cannot map falls through to the map itself.

    var FROM = '/out-dc/', TO = '/hum/';
    var p = location.pathname;
    var rest = p.indexOf(FROM) === 0 ? p.slice(FROM.length) : '';
    location.replace(TO + rest + location.search + location.hash);
  })();
</script>
